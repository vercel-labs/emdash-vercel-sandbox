name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm run check
  release-installer:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download the official Node runtime
        run: |
          mkdir -p "$RUNNER_TEMP/node-dist"
          curl -fsSL --proto '=https' --tlsv1.2 https://nodejs.org/dist/v24.14.0/node-v24.14.0-darwin-arm64.tar.gz -o "$RUNNER_TEMP/node-dist/node-v24.14.0-darwin-arm64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 https://nodejs.org/dist/v24.14.0/SHASUMS256.txt -o "$RUNNER_TEMP/node-dist/SHASUMS256.txt"
      - name: Build and verify the distributed installer
        run: |
          pnpm run build:release -- --output "$RUNNER_TEMP/emdash-release" --node-archive "$RUNNER_TEMP/node-dist/node-v24.14.0-darwin-arm64.tar.gz" --checksums "$RUNNER_TEMP/node-dist/SHASUMS256.txt"
          pnpm run test:release -- --archive "$RUNNER_TEMP/emdash-release/emdash-sandbox-darwin-arm64.tar.gz"
